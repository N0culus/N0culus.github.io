<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Arial Narrow',Arial,sans-serif">
  <defs>
    <style>
      .bg{fill:#f3f1ea}
      .box{fill:#faf9f5;stroke:#141414;stroke-width:1.5}
      .zone{fill:#faf9f5;stroke:#cfcbc0;stroke-width:1.5}
      .fw{fill:#faf9f5;stroke:#d1202f;stroke-width:2.5}
      .ink{fill:#141414}
      .muted{fill:#5f5c55}
      .accent{fill:#d1202f}
      .line{stroke:#9a978e;stroke-width:1.5;fill:none}
      .tt{font-family:'Courier New',monospace}
      .h{font-weight:700;font-stretch:condensed}
      .lbl{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.08em}
    </style>
  </defs>

  <rect class="bg" width="980" height="760"/>

  <!-- Titre -->
  <text x="30" y="40" class="h ink" font-size="26" letter-spacing="-.5">PROJET ITWAY</text>
  <text x="30" y="60" class="lbl muted">INFRASTRUCTURE DOCKERISÉE · DÉPLOIEMENT ANSIBLE · MAQUETTE GNS3</text>
  <line x1="30" y1="74" x2="950" y2="74" stroke="#141414" stroke-width="2"/>

  <!-- Internet -->
  <rect class="box" x="430" y="100" width="120" height="34"/>
  <text x="490" y="122" class="tt ink" font-size="13" text-anchor="middle">Internet</text>
  <line class="line" x1="490" y1="134" x2="490" y2="156"/>

  <!-- Pare-feu -->
  <rect class="fw" x="300" y="156" width="380" height="58" rx="2"/>
  <text x="490" y="182" class="h ink" font-size="17" text-anchor="middle">Pare-feu Stormshield</text>
  <text x="490" y="201" class="lbl muted" text-anchor="middle">FILTRAGE &amp; SÉCURITÉ RÉSEAU · SEGMENTATION VLAN</text>

  <!-- Bus vers VLAN -->
  <line class="line" x1="490" y1="214" x2="490" y2="236"/>
  <line class="line" x1="170" y1="236" x2="810" y2="236"/>
  <line class="line" x1="170" y1="236" x2="170" y2="258"/>
  <line class="line" x1="490" y1="236" x2="490" y2="258"/>
  <line class="line" x1="810" y1="236" x2="810" y2="258"/>

  <!-- VLAN zones -->
  <g>
    <rect class="zone" x="40" y="258" width="260" height="70"/>
    <text x="56" y="286" class="h ink" font-size="16">VLAN 10</text>
    <text x="56" y="308" class="lbl muted">ADMINISTRATION</text>
  </g>
  <g>
    <rect class="zone" x="360" y="258" width="260" height="70"/>
    <text x="376" y="286" class="h ink" font-size="16">VLAN 20</text>
    <text x="376" y="308" class="lbl muted">SERVEURS</text>
  </g>
  <g>
    <rect class="zone" x="680" y="258" width="260" height="70"/>
    <text x="696" y="286" class="h ink" font-size="16">VLAN 30</text>
    <text x="696" y="308" class="lbl muted">UTILISATEURS</text>
  </g>

  <!-- vers environnement Docker -->
  <line class="line" x1="170" y1="328" x2="170" y2="352"/>
  <line class="line" x1="490" y1="328" x2="490" y2="352"/>
  <line class="line" x1="810" y1="328" x2="810" y2="352"/>
  <line class="line" x1="170" y1="352" x2="810" y2="352"/>
  <line class="line" x1="490" y1="352" x2="490" y2="366"/>

  <!-- Environnement Docker -->
  <rect x="40" y="366" width="900" height="268" fill="none" stroke="#141414" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect class="ink" x="40" y="366" width="230" height="26"/>
  <text x="52" y="384" class="lbl" fill="#f3f1ea">ENVIRONNEMENT DOCKER</text>

  <!-- Services : 3 colonnes x 2 lignes -->
  <!-- ligne 1 -->
  <g>
    <rect class="box" x="70" y="412" width="260" height="92"/>
    <text x="86" y="442" class="h ink" font-size="17">Bind9</text>
    <text x="86" y="466" class="lbl muted">SERVEUR DNS</text>
    <text x="86" y="486" class="lbl muted">RÉSOLUTION DE NOMS INTERNE</text>
  </g>
  <g>
    <rect class="box" x="360" y="412" width="260" height="92"/>
    <text x="376" y="442" class="h ink" font-size="17">Postfix</text>
    <text x="376" y="466" class="lbl muted">MESSAGERIE — ENVOI</text>
    <text x="376" y="486" class="lbl muted">RELAIS SMTP, DMZ</text>
  </g>
  <g>
    <rect class="box" x="650" y="412" width="260" height="92"/>
    <text x="666" y="442" class="h ink" font-size="17">Dovecot</text>
    <text x="666" y="466" class="lbl muted">MESSAGERIE — RÉCEPTION</text>
    <text x="666" y="486" class="lbl muted">IMAP / POP3, STOCKAGE</text>
  </g>
  <!-- ligne 2 -->
  <g>
    <rect class="box" x="70" y="520" width="260" height="92"/>
    <text x="86" y="550" class="h ink" font-size="17">MariaDB</text>
    <text x="86" y="574" class="lbl muted">BASE DE DONNÉES</text>
    <text x="86" y="594" class="lbl muted">COMPTES &amp; E-MAILS</text>
  </g>
  <g>
    <rect class="box" x="360" y="520" width="260" height="92"/>
    <text x="376" y="550" class="h ink" font-size="17">Ansible</text>
    <text x="376" y="574" class="lbl muted">DÉPLOIEMENT AUTOMATISÉ</text>
    <text x="376" y="594" class="lbl muted">PLAYBOOKS, LDAP / AD</text>
  </g>
  <g>
    <rect class="box" x="650" y="520" width="260" height="92"/>
    <text x="666" y="550" class="h ink" font-size="17">GNS3</text>
    <text x="666" y="574" class="lbl muted">MAQUETTAGE RÉSEAU</text>
    <text x="666" y="594" class="lbl muted">SIMULATION AVANT DÉPLOIEMENT</text>
  </g>

  <!-- Bande SCRUM -->
  <line x1="30" y1="666" x2="950" y2="666" stroke="#cfcbc0" stroke-width="1.5"/>
  <text x="30" y="700" class="lbl muted">MÉTHODOLOGIE SCRUM</text>
  <g font-size="13" class="tt ink">
    <text x="300" y="704">Product Backlog</text>
    <text x="470" y="704" class="accent">→</text>
    <text x="492" y="704">Sprints</text>
    <text x="588" y="704" class="accent">→</text>
    <text x="610" y="704">Daily Standup</text>
    <text x="748" y="704" class="accent">→</text>
    <text x="770" y="704">Livraison</text>
  </g>
</svg>
