<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Arial Narrow',Arial,sans-serif">
  <defs>
    <style>
      .bg{fill:#f3f1ea}
      .ink{fill:#141414}
      .muted{fill:#5f5c55}
      .accent{fill:#d1202f}
      .tt{font-family:'Courier New',monospace}
      .h{font-weight:700;font-stretch:condensed}
      .tag{fill:#faf9f5;stroke:#cfcbc0;stroke-width:1.5}
      .lbl{font-family:'Courier New',monospace;font-size:11px;letter-spacing:.08em}
    </style>
  </defs>

  <rect class="bg" width="980" height="560"/>
  <rect class="accent" x="0" y="0" width="980" height="8"/>

  <text x="40" y="70" class="lbl muted">CTF · ÉVÉNEMENT INTER-ÉCOLES · 2026</text>
  <text x="40" y="150" class="h ink" font-size="78" letter-spacing="-2">UNE NUIT</text>
  <text x="40" y="226" class="h ink" font-size="78" letter-spacing="-2">POUR <tspan class="accent">HACKER</tspan></text>
  <text x="40" y="266" class="muted" font-size="18">Co-organisation : conception des challenges et infrastructure d'hébergement.</text>

  <!-- Stats -->
  <line x1="40" y1="300" x2="940" y2="300" stroke="#141414" stroke-width="2"/>
  <g>
    <text x="40" y="364" class="h ink" font-size="54" letter-spacing="-1">150+</text>
    <text x="42" y="388" class="lbl muted">PARTICIPANTS</text>
  </g>
  <g>
    <text x="300" y="364" class="h ink" font-size="54" letter-spacing="-1">130+</text>
    <text x="302" y="388" class="lbl muted">CHALLENGES</text>
  </g>
  <g>
    <text x="560" y="364" class="h ink" font-size="54" letter-spacing="-1">9</text>
    <text x="562" y="388" class="lbl muted">UNIVERS</text>
  </g>
  <line x1="280" y1="320" x2="280" y2="392" stroke="#cfcbc0" stroke-width="1.5"/>
  <line x1="540" y1="320" x2="540" y2="392" stroke="#cfcbc0" stroke-width="1.5"/>

  <!-- Catégories -->
  <g class="tt" font-size="13">
    <g><rect class="tag" x="40" y="420" width="120" height="30"/><text x="100" y="440" class="ink" text-anchor="middle">Active Directory</text></g>
    <g><rect class="tag" x="170" y="420" width="70" height="30"/><text x="205" y="440" class="ink" text-anchor="middle">WiFi</text></g>
    <g><rect class="tag" x="250" y="420" width="70" height="30"/><text x="285" y="440" class="ink" text-anchor="middle">Web</text></g>
    <g><rect class="tag" x="330" y="420" width="70" height="30"/><text x="365" y="440" class="ink" text-anchor="middle">SQLi</text></g>
    <g><rect class="tag" x="410" y="420" width="90" height="30"/><text x="455" y="440" class="ink" text-anchor="middle">Reverse</text></g>
    <g><rect class="tag" x="510" y="420" width="80" height="30"/><text x="550" y="440" class="ink" text-anchor="middle">OSINT</text></g>
    <g><rect class="tag" x="600" y="420" width="120" height="30"/><text x="660" y="440" class="ink" text-anchor="middle">Cryptographie</text></g>
    <g><rect class="tag" x="730" y="420" width="120" height="30"/><text x="790" y="440" class="ink" text-anchor="middle">Code Review</text></g>
    <g><rect class="tag" x="860" y="420" width="70" height="30"/><text x="895" y="440" class="ink" text-anchor="middle">Misc</text></g>
  </g>

  <!-- Infra -->
  <line x1="40" y1="492" x2="940" y2="492" stroke="#cfcbc0" stroke-width="1.5"/>
  <text x="40" y="524" class="lbl muted">INFRASTRUCTURE</text>
  <text x="200" y="524" class="tt ink" font-size="13">Cluster Proxmox + Ceph  ·  derrière un pare-feu Fortigate</text>
</svg>
